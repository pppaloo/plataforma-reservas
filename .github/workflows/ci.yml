name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/health" || true)
            echo "Intento $i: HTTP $status"
            if [ "$status" = "200" ]; then
              curl -s "$APP_URL/api/health"
              exit 0
            fi
            sleep 10
          done
          echo "Health check fallido"
          exit 1
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          APP_URL: ${{ secrets.PUBLIC_URL }}
